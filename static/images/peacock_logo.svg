<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="peacockEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="35%" stop-color="#0077b6"/>
      <stop offset="60%" stop-color="#00f5d4"/>
      <stop offset="85%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0582ca"/>
      <stop offset="50%" stop-color="#00a896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background decorative plumage fan -->
  <g transform="translate(100, 110)">
    <!-- Outer Feathers fan -->
    <path d="M 0 0 C -45 -70 -70 -100 -55 -115 C -40 -125 -25 -90 0 0" fill="url(#featherGrad)" opacity="0.85"/>
    <path d="M 0 0 C -25 -80 -40 -120 -20 -130 C -5 -135 5 -100 0 0" fill="url(#featherGrad)" opacity="0.95"/>
    <path d="M 0 0 C -10 -90 0 -135 15 -135 C 30 -130 15 -90 0 0" fill="url(#featherGrad)" opacity="0.95"/>
    <path d="M 0 0 C 15 -80 35 -125 50 -120 C 65 -110 35 -75 0 0" fill="url(#featherGrad)" opacity="0.85"/>
    <path d="M 0 0 C -60 -50 -95 -75 -85 -95 C -75 -110 -45 -55 0 0" fill="url(#featherGrad)" opacity="0.75"/>
    <path d="M 0 0 C 60 -50 95 -75 85 -95 C 75 -110 45 -55 0 0" fill="url(#featherGrad)" opacity="0.75"/>

    <!-- Peacock Feather Eye Ocelli -->
    <ellipse cx="-52" cy="-98" rx="14" ry="17" transform="rotate(-30, -52, -98)" fill="url(#peacockEye)" filter="url(#glow)"/>
    <ellipse cx="-18" cy="-118" rx="15" ry="18" transform="rotate(-10, -18, -118)" fill="url(#peacockEye)" filter="url(#glow)"/>
    <ellipse cx="20" cy="-118" rx="15" ry="18" transform="rotate(10, 20, -118)" fill="url(#peacockEye)" filter="url(#glow)"/>
    <ellipse cx="52" cy="-98" rx="14" ry="17" transform="rotate(30, 52, -98)" fill="url(#peacockEye)" filter="url(#glow)"/>
    <ellipse cx="-75" cy="-70" rx="12" ry="15" transform="rotate(-50, -75, -70)" fill="url(#peacockEye)"/>
    <ellipse cx="75" cy="-70" rx="12" ry="15" transform="rotate(50, 75, -70)" fill="url(#peacockEye)"/>
  </g>

  <!-- Peacock Body -->
  <path d="M 88 120 C 85 90 92 65 102 55 C 108 50 115 52 114 62 C 113 72 108 92 112 120 C 116 145 92 145 88 120 Z" fill="#003566"/>
  <path d="M 92 110 C 90 85 96 68 103 60 C 106 58 110 60 109 68 C 107 80 104 100 106 120 C 103 130 94 125 92 110 Z" fill="#0077b6"/>

  <!-- Head & Beak -->
  <ellipse cx="106" cy="50" rx="9" ry="11" fill="#001845"/>
  <polygon points="115,50 126,53 115,55" fill="url(#crestGold)"/>
  
  <!-- Eye -->
  <circle cx="108" cy="48" r="2.2" fill="#ffffff"/>
  <circle cx="108.5" cy="48" r="1.2" fill="#000814"/>

  <!-- Crest feathers on crown -->
  <path d="M 104 40 L 98 25 M 106 39 L 105 22 M 108 40 L 112 24" stroke="#00f5d4" stroke-width="2" stroke-linecap="round"/>
  <circle cx="98" cy="24" r="3" fill="url(#crestGold)"/>
  <circle cx="105" cy="21" r="3.2" fill="url(#crestGold)"/>
  <circle cx="112" cy="23" r="3" fill="url(#crestGold)"/>
  
  <!-- Base pedestal / book motif -->
  <path d="M 60 150 L 140 150 L 145 162 L 55 162 Z" fill="#023e8a"/>
  <path d="M 55 162 L 145 162 L 150 172 L 50 172 Z" fill="#0077b6"/>
  <rect x="52" y="160" width="96" height="4" fill="url(#crestGold)" rx="2"/>
</svg>
